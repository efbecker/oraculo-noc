<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oráculo - Painel NOC & SecOps</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; display: flex; height: 100vh; }
        .chat-container { flex: 1; display: flex; flex-direction: column; background-color: #161616; }
        .chat-header { background-color: #1e1e1e; padding: 15px 25px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .chat-title { font-size: 18px; font-weight: bold; color: #00e5ff; display: flex; align-items: center; gap: 10px; }
        .user-info { display: flex; align-items: center; gap: 15px; font-size: 14px; color: #aaa; }
        
        /* Estilização dos Botões Superiores */
        .btn-header { padding: 6px 12px; border-radius: 4px; font-weight: bold; text-decoration: none; font-size: 13px; transition: 0.3s; display: inline-flex; align-items: center; gap: 5px; }
        .btn-admin { background-color: #242424; color: #00e5ff; border: 1px solid #00e5ff; }
        .btn-admin:hover { background-color: #00e5ff; color: #121212; }
        .btn-logout { background-color: #ff4d4d; color: white; border: none; }
        .btn-logout:hover { background-color: #ff1a1a; }
        
        .chat-messages { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 18px; border-radius: 8px; line-height: 1.5; font-size: 14px; word-wrap: break-word; }
        .message.user { background-color: #0077ff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.bot { background-color: #242424; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #333; }
        .chat-input-container { padding: 20px; background-color: #1e1e1e; border-top: 1px solid #333; display: flex; gap: 12px; }
        .chat-input { flex: 1; background-color: #121212; color: white; border: 1px solid #444; padding: 12px 15px; border-radius: 6px; font-size: 14px; outline: none; }
        .chat-input:focus { border-color: #00e5ff; }
        .btn-send { background-color: #00e5ff; color: #121212; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-send:hover { background-color: #00b4d8; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-title">🤖 Oráculo NOC & SecOps <span style="font-size:11px; background:#242424; color:#888; padding:2px 6px; border-radius:4px; border:1px solid #333;">{{ grupo_cliente }}</span></div>
            <div class="user-info">
                <span>Olá, <strong>{{ username }}</strong> ({{ profile }})</span>
                
                {% if profile == 'ADMINISTRADOR' %}
                <a href="/admin" class="btn-header btn-admin">⚙️ Painel Admin</a>
                {% endif %}
                
                <a href="/logout" class="btn-header btn-logout">Sair</a>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-container">
            <input type="text" class="chat-input" id="chatInput" placeholder="Pergunte ao Oráculo (ex: Como está a infra? Gerar relatório FinOps de 7 dias...)" onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn-send" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');

        async function loadHistory() {
            try {
                const response = await fetch('/api/chat/history');
                const messages = await response.json();
                chatMessages.innerHTML = '';
                messages.forEach(msg => appendMessage(msg.sender === 'user' ? 'user' : 'bot', msg.content, msg.is_html));
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (e) { console.error("Erro ao carregar histórico", e); }
        }

        function appendMessage(sender, content, isHtml = false) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            if (isHtml) { msgDiv.innerHTML = content; } 
            else { msgDiv.textContent = content; }
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            chatInput.value = '';
            appendMessage('user', message);

            try {
                const response = await fetch('/api/chat/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                appendMessage('bot', data.reply, data.is_html);
            } catch (e) {
                appendMessage('bot', '❌ Erro de comunicação com o servidor.');
            }
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
