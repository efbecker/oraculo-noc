<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oráculo - Painel NOC & SecOps</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0b1117; color: #e0e0e0; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Barra Lateral (Sidebar) Clássica */
        .sidebar { width: 250px; background-color: #080c11; border-right: 1px solid #1f2933; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px 20px; font-size: 18px; font-weight: bold; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; color: #fff; }
        .badge-noc { background: #00e5ff; color: #000; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: 800; }
        .sidebar-section { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2933; color: #888; font-size: 13px; text-transform: uppercase; font-weight: 600; }
        .icon-btn { cursor: pointer; color: #888; transition: 0.3s; }
        .icon-btn:hover { color: #00e5ff; }
        .sidebar-item { margin: 15px; background: #131c26; padding: 12px 15px; border-radius: 8px; color: #00e5ff; font-size: 14px; display: flex; align-items: center; gap: 10px; font-weight: 500; cursor: pointer; border-left: 3px solid #00e5ff; }
        
        /* Área Central do Chat */
        .main-area { flex: 1; display: flex; flex-direction: column; position: relative; background-color: #0d131a; min-width: 0; }
        
        /* Cabeçalho Superior Direito */
        .top-right-header { position: absolute; top: 20px; right: 25px; display: flex; gap: 10px; z-index: 10; flex-wrap: wrap; }
        .badge-info { background: #1f2933; padding: 6px 15px; border-radius: 6px; font-size: 12px; display: flex; align-items: center; gap: 8px; color: #aaa; border: 1px solid #2d3748; }
        .badge-admin { background: #1f2933; color: #00e5ff; text-decoration: none; padding: 6px 15px; border-radius: 6px; font-size: 12px; display: flex; align-items: center; gap: 8px; font-weight: bold; border: 1px solid #00e5ff; transition: 0.3s; }
        .badge-admin:hover { background: #00e5ff; color: #000; }
        .badge-logout { background: transparent; border: none; color: #ff4d4d; cursor: pointer; padding: 6px 10px; font-size: 16px; transition: 0.3s; text-decoration: none; }
        .badge-logout:hover { color: #ff1a1a; transform: scale(1.1); }
        
        /* Lista de Mensagens Centralizada e Compacta */
        .chat-messages { flex: 1; overflow-y: auto; padding: 80px 15% 20px 15%; display: flex; flex-direction: column; gap: 20px; }
        
        /* Balões de Mensagem Originais */
        .msg-user { background: #1e293b; color: #fff; padding: 12px 20px; border-radius: 20px; max-width: 70%; align-self: flex-end; font-size: 14.5px; line-height: 1.5; border-bottom-right-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .msg-bot { border-left: 3px solid #00e5ff; padding-left: 20px; color: #cbd5e1; max-width: 85%; align-self: flex-start; font-size: 14.5px; line-height: 1.6; margin-bottom: 10px; }
        .msg-bot strong { color: #fff; }
        
        /* Caixa de Entrada */
        .input-wrapper { padding: 20px 15%; padding-bottom: 35px; background: transparent; }
        .input-box { background: #151e27; border: 1px solid #2d3748; border-radius: 30px; display: flex; align-items: center; padding: 5px 10px 5px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .input-box input { flex: 1; background: transparent; border: none; color: #fff; padding: 12px 10px; outline: none; font-size: 14px; min-width: 0; }
        .input-box input::placeholder { color: #64748b; }
        
        .btn-icon { background: transparent; border: none; color: #64748b; padding: 10px 12px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-icon:hover { color: #e2e8f0; }
        .btn-icon.active { color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        .btn-icon.recording { color: #ff4d4d; animation: pulsar-rec 0.8s infinite alternate; }
        
        .btn-send { background: #0077ff; color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; flex-shrink: 0; }
        .btn-send:hover { background: #0055ff; transform: translateY(-2px); }
        
        .loading { color: #00e5ff; font-size: 14px; font-style: italic; margin-left: 20px; display: none; }
        
        @keyframes pulsar-rec { from { opacity: 0.4; } to { opacity: 1; } }

        /* RESPONSIVIDADE COMPLETA PARA CELULAR */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid #1f2933; }
            .sidebar-header { padding: 15px; justify-content: center; }
            .sidebar-section, .sidebar-item { display: none; }
            
            .top-right-header { position: relative; top: 0; right: 0; padding: 10px; background: #080c11; justify-content: center; width: 100%; box-sizing: border-box; gap: 8px; }
            .badge-info, .badge-admin { padding: 5px 10px; font-size: 11px; }
            
            .chat-messages { padding: 20px 15px; }
            .msg-user { max-width: 85%; }
            .msg-bot { max-width: 100%; }
            .input-wrapper { padding: 10px 15px 25px 15px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            Oráculo <span class="badge-noc">NOC/SOC</span>
        </div>
        <div class="sidebar-section">
            <span><i class="fas fa-history" style="margin-right: 5px;"></i> Histórico</span>
            <i class="fas fa-edit icon-btn" title="Limpar Histórico" onclick="clearHistory()"></i>
        </div>
        <div class="sidebar-item">
            <i class="fas fa-calendar-day"></i> Hoje
        </div>
    </div>

    <div class="main-area">
        <div class="top-right-header">
            <div class="badge-info"><i class="fas fa-server"></i> {{ grupo_cliente }}</div>
            
            {% if profile in ['ADMIN', 'ADMINISTRADOR'] %}
            <a href="/admin" class="badge-admin"><i class="fas fa-cog"></i> Admin</a>
            {% endif %}
            
            <div class="badge-info" style="color: #fff;"><i class="fas fa-user-circle"></i> {{ username|upper }}</div>
            <a href="/logout" class="badge-logout" title="Sair"><i class="fas fa-power-off"></i></a>
        </div>
        
        <div class="chat-messages" id="chatMessages"></div>
        <div id="loading" class="loading msg-bot">Oráculo está analisando o Zabbix...</div>

        <div class="input-wrapper">
            <div class="input-box">
                <button class="btn-icon" id="btnSpeaker" onclick="toggleTTS()" title="Ativar Resposta por Voz"><i class="fas fa-volume-up"></i></button>
                <button class="btn-icon" id="btnMic" onclick="toggleSTT()" title="Falar ao Microfone"><i class="fas fa-microphone"></i></button>
                
                <input type="text" id="chatInput" placeholder="Pergunte ao Oráculo sobre infraestrutura ou secops..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="btn-send" onclick="sendMessage()"><i class="fas fa-arrow-up"></i></button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const loading = document.getElementById('loading');
        const btnSpeaker = document.getElementById('btnSpeaker');
        const btnMic = document.getElementById('btnMic');

        let ttsEnabled = false;
        let recognition = null;
        let isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRecording = true;
                btnMic.classList.add('recording');
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                chatInput.value = text;
                // MÁGICA RESTAURADA: Envia na hora de forma automática!
                sendMessage();
            };

            recognition.onerror = (e) => { console.error("Erro STT:", e); };
            recognition.onend = () => {
                isRecording = false;
                btnMic.classList.remove('recording');
            };
        }

        function toggleTTS() {
            ttsEnabled = !ttsEnabled;
            if (ttsEnabled) { btnSpeaker.classList.add('active'); } 
            else { btnSpeaker.classList.remove('active'); }
        }

        function toggleSTT() {
            if (!recognition) {
                alert("Reconhecimento de voz não suportado neste navegador.");
                return;
            }
            if (isRecording) { recognition.stop(); } 
            else { recognition.start(); }
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/chat/history');
                const messages = await response.json();
                chatMessages.innerHTML = '';
                messages.forEach(msg => appendMessage(msg.sender === 'user' ? 'user' : 'bot', msg.content, msg.is_html));
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (e) { console.error("Erro ao carregar histórico", e); }
        }

        async function clearHistory() {
            if(confirm("Deseja apagar todo o histórico de conversas?")) {
                await fetch('/api/chat/clear', { method: 'POST' });
                chatMessages.innerHTML = '';
            }
        }

        function appendMessage(sender, content, isHtml = false) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add(sender === 'user' ? 'msg-user' : 'msg-bot');
            if (isHtml) { msgDiv.innerHTML = content; } 
            else { msgDiv.innerHTML = content.replace(/\n/g, '<br>'); }
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            chatInput.value = '';
            appendMessage('user', message);
            
            loading.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/api/chat/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, tts_enabled: ttsEnabled })
                });
                const data = await response.json();
                loading.style.display = 'none';
                
                if(data.error) {
                    appendMessage('bot', `❌ Erro do servidor: ${data.error}`);
                } else {
                    appendMessage('bot', data.reply || "⚠️ Nenhuma resposta obtida da IA.", data.is_html);
                    
                    // GATILHO DE ÁUDIO RESTAURADO: Toca o MP3 se o speaker estiver ativo
                    if (ttsEnabled && data.audio_path) {
                        const audio = new Audio(data.audio_path);
                        audio.play().catch(err => console.error("Erro ao reproduzir áudio:", err));
                    }
                }
            } catch (e) {
                loading.style.display = 'none';
                appendMessage('bot', '❌ Erro de comunicação com o servidor.');
            }
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
