<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oráculo - Painel NOC & SecOps</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; display: flex; height: 100vh; }
        .chat-container { flex: 1; display: flex; flex-direction: column; background-color: #161616; }
        
        /* Cabeçalho Clássico */
        .chat-header { background-color: #1e1e1e; padding: 18px 25px; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .chat-title { font-size: 19px; font-weight: 700; color: #00e5ff; display: flex; align-items: center; gap: 12px; letter-spacing: 0.5px; }
        .user-info { display: flex; align-items: center; gap: 15px; font-size: 14px; color: #b0b0b0; }
        
        /* Estilo Premium dos Botões */
        .btn-header { padding: 8px 16px; border-radius: 5px; font-weight: bold; text-decoration: none; font-size: 13px; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 6px; box-sizing: border-box; }
        .btn-admin { background-color: #1a1a1a; color: #00e5ff; border: 1px solid #00e5ff; box-shadow: 0 0 10px rgba(0,229,255,0.1); }
        .btn-admin:hover { background-color: #00e5ff; color: #121212; box-shadow: 0 0 15px rgba(0,229,255,0.4); }
        .btn-logout { background-color: #2a1f1f; color: #ff4d4d; border: 1px solid #ff4d4d; }
        .btn-logout:hover { background-color: #ff4d4d; color: white; box-shadow: 0 0 15px rgba(255,77,77,0.4); }
        
        /* Mensagens e Caixa de Entrada */
        .chat-messages { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; background: linear-gradient(180deg, #141414 0%, #161616 100%); }
        .message { max-width: 75%; padding: 14px 20px; border-radius: 8px; line-height: 1.6; font-size: 14.5px; word-wrap: break-word; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .message.user { background: linear-gradient(135deg, #0055ff 0%, #0077ff 100%); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.bot { background-color: #1e1e1e; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #2d2d2d; }
        
        .chat-input-container { padding: 20px 30px; background-color: #1e1e1e; border-top: 1px solid #2a2a2a; display: flex; gap: 15px; box-shadow: 0 -4px 15px rgba(0,0,0,0.3); }
        .chat-input { flex: 1; background-color: #121212; color: white; border: 1px solid #3d3d3d; padding: 14px 18px; border-radius: 6px; font-size: 14px; outline: none; transition: border 0.3s; }
        .chat-input:focus { border-color: #00e5ff; box-shadow: 0 0 8px rgba(0,229,255,0.2); }
        .btn-send { background: linear-gradient(135deg, #00e5ff 0%, #00b4d8 100%); color: #121212; border: none; padding: 0 25px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .btn-send:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,229,255,0.3); }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-title">🤖 Oráculo NOC & SecOps <span style="font-size:11px; background:#282828; color:#00e5ff; padding:3px 8px; border-radius:4px; border:1px solid #3a3d3d; font-family:monospace;">{{ grupo_cliente }}</span></div>
            <div class="user-info">
                <span>Operador: <strong style="color:#fff;">{{ username }}</strong> <span style="font-size:11px; color:#888;">({{ profile }})</span></span>
                
                {% if profile == 'ADMINISTRADOR' %}
                <a href="/admin" class="btn-header btn-admin">⚙️ Painel Admin</a>
                {% endif %}
                
                <a href="/logout" class="btn-header btn-logout">Sair</a>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-container">
            <input type="text" class="chat-input" id="chatInput" placeholder="Digite sua instrução de NOC ou SecOps..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn-send" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');

        async function loadHistory() {
            try {
                const response = await fetch('/api/chat/history');
                const messages = await response.json();
                chatMessages.innerHTML = '';
                messages.forEach(msg => appendMessage(msg.sender === 'user' ? 'user' : 'bot', msg.content, msg.is_html));
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (e) { console.error("Erro ao carregar histórico", e); }
        }

        function appendMessage(sender, content, isHtml = false) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            if (isHtml) { msgDiv.innerHTML = content; } 
            else { msgDiv.textContent = content; }
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            chatInput.value = '';
            appendMessage('user', message);

            try {
                const response = await fetch('/api/chat/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                appendMessage('bot', data.reply, data.is_html);
            } catch (e) {
                appendMessage('bot', '❌ Erro de comunicação com o servidor.');
            }
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
