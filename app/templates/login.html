<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Oráculo Armazém Cloud</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{ --bg:#0b0e14;--card:#151b23;--text:#e6edf3;--accent:#1f6feb;--border:#30363d; }
        body{ margin:0; font-family:Segoe UI,sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; align-items:center; height:100vh; }
        .login-box { background:var(--card); border:1px solid var(--border); padding:40px 30px; border-radius:12px; width:100%; max-width:380px; text-align:center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .logo-icon { font-size: 3rem; color: var(--accent); margin-bottom: 15px; }
        h1{ font-family:Courier New,monospace; color:#fff; margin-top:0; font-size: 1.8rem; margin-bottom: 5px; }
        input { width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--text); font-size:1rem; outline:none; padding:14px; border-radius:8px; margin-bottom:15px; box-sizing:border-box; transition: 0.3s;}
        input:focus { border-color: var(--accent); box-shadow: 0 0 8px rgba(31, 111, 235, 0.3);}
        button { width:100%; background:var(--accent); border:none; color:#fff; font-weight:bold; padding:14px; border-radius:8px; cursor:pointer; font-size:1rem; transition: 0.2s; margin-top: 10px;}
        button:hover { filter: brightness(1.15); transform: translateY(-1px); }
        #errorMsg { color: #f85149; font-size: 0.85rem; margin-top: 15px; display: none; background: rgba(248, 81, 73, 0.1); padding: 10px; border-radius: 6px;}
    </style>
</head>
<body>
<div class="login-box">
    {% if logo_data_uri %}
    <img src="{{ logo_data_uri }}" alt="Logo" style="max-height:70px; max-width:220px; object-fit:contain; margin-bottom:15px;">
    {% else %}
    <i class="fas fa-network-wired logo-icon"></i>
    {% endif %}
    <h1>Oráculo</h1>
    <p style="color:#8b949e; font-size:0.9rem; margin-bottom:30px;">NOC & SOC</p>
    
    <input type="text" id="username" placeholder="Usuário" autocomplete="off">
    <input type="password" id="password" placeholder="Senha">
    <button onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Acessar Sistema</button>
    <div id="errorMsg"><i class="fas fa-exclamation-triangle"></i> Credenciais inválidas.</div>
</div>

<script>
// Aviso de sessão expirada por inatividade (veio de um 401 -> /login?expirado=1).
if (new URLSearchParams(location.search).get('expirado')) {
    const box = document.getElementById("errorMsg");
    box.innerHTML = "<i class='fas fa-clock'></i> Sua sessão expirou por inatividade. Faça login novamente.";
    box.style.color = "#e3b341";
    box.style.background = "rgba(227, 179, 65, 0.1)";
    box.style.display = "block";
}
async function doLogin(){
    const u = document.getElementById("username").value;
    const p = document.getElementById("password").value;
    const btn = document.querySelector("button");
    btn.innerHTML = "<i class='fas fa-circle-notch fa-spin'></i> Autenticando...";
    try {
        const res = await fetch("/login", { 
            method:"POST", 
            headers:{"Content-Type":"application/json"}, 
            body:JSON.stringify({username:u, password:p}) 
        });
        if(res.ok){
            // Se o usuário tentou abrir uma página protegida antes de logar
            // (ex.: /admin), o backend devolve esse destino para voltarmos
            // direto pra lá; senão, cai no chat.
            let destino = "/";
            try { const d = await res.json(); if (d && d.redirect) destino = d.redirect; } catch(e) {}
            window.location.href = destino;
        }
        else { 
            document.getElementById("errorMsg").style.display = "block"; 
            btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Acessar Sistema`; 
        }
    } catch(e) { 
        alert("Erro de conexão com o servidor."); 
        btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Acessar Sistema`; 
    }
}
document.addEventListener("keypress", function(e) { if(e.key === "Enter") doLogin(); });
</script>
</body>
</html>
